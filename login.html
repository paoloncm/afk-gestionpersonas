<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro — AFK RRHH (Nivel Stark)</title>
  <link rel="stylesheet" href="static/styles.css">
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
      background-color: #0a0a0a;
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
    }
    .login-container {
      max-width: 400px; width: 100%; padding: 20px;
      animation: emerge 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes emerge {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-card {
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      position: relative;
    }
    .brand {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 24px;
    }
    .brand-dot {
      width: 8px; height: 8px; background: #f59e0b; border-radius: 50%;
    }
    .brand-name {
      font-size: 20px; font-weight: 700; letter-spacing: -0.5px;
    }
    .login-title {
      font-size: 24px; font-weight: 700; letter-spacing: -0.5px;
      text-align: center; margin-bottom: 30px;
    }
    label {
      display: block; font-size: 13px; color: #888; margin-bottom: 8px;
    }
    input {
      width: 100%; background: #0a0a0a; border: 1px solid rgba(255,255,255,0.1);
      padding: 14px; border-radius: 8px; color: white; margin-bottom: 20px;
      transition: all 0.2s; font-size: 15px;
    }
    input:focus { outline: none; border-color: #f59e0b; }
    .btn-login {
      width: 100%; background: #f59e0b; color: #000;
      border: none; padding: 14px; border-radius: 8px;
      font-weight: 600; font-size: 15px; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-box {
      background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444;
      color: #ef4444; padding: 12px; border-radius: 8px; font-size: 14px;
      margin-bottom: 20px; display: none; text-align: center;
    }
    .footer-link {
      margin-top: 25px; text-align: center; font-size: 13px; color: #666;
    }
    .footer-link a { color: #f59e0b; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand">
        <div class="brand-dot"></div>
        <div class="brand-name">AFK RRHH</div>
      </div>
      
      <div class="login-title">Iniciar sesión</div>

      <div id="errorBox" class="error-box"></div>

      <form id="loginForm">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="nombre@empresa.com" required>
        
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <button type="submit" class="btn-login" id="btnLogin">Ingresar a la plataforma</button>
      </form>

      <div class="footer-link">
        ¿Problemas para acceder? <a href="#">Soporte</a>
      </div>
    </div>
  </div>

  <script src="/static/supabase-js.2.js"></script>
  <script src="/static/supabase.js"></script>
  <script src="/static/auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const errorBox = document.getElementById('errorBox');
    const btn = document.getElementById('btnLogin');

    form.onsubmit = async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'VERIFICANDO CREDENCIALES...';
      errorBox.style.display = 'none';

      try {
        const { error } = await window.supabase.auth.signInWithPassword({
          email: emailInput.value,
          password: passInput.value
        });

        if (error) throw error;

        // Éxito: Redirigir al dashboard
        window.location.href = 'app.html';
      } catch (err) {
        errorBox.textContent = 'ERROR: ' + (err.message === 'Invalid login credentials' ? 'CREDENCIALES INVÁLIDAS' : err.message.toUpperCase());
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'REINTENTAR ACCESO';
      }
    };
  </script>
</body>
</html>
